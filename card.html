<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8">
  <title>信用卡詳情 | HK Miles</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/logo.png" type="image/png">
  <script>
    // Credit card pages now share the article.html layout. Redirect any
    // legacy ?slug= URLs to article.html?card= so existing links keep working.
    (function () {
      const params = new URLSearchParams(location.search);
      const slug = params.get('slug') || params.get('card') || 'red-card';
      location.replace(`article.html?card=${encodeURIComponent(slug)}${location.hash || ''}`);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=article.html">
</head>
<body>
  <p style="font-family: system-ui, sans-serif; padding: 40px; color: #475569;">
    Redirecting… <a href="article.html">繼續</a>
  </p>
</body>
</html>
