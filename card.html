<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>信用卡詳情 | HK Miles</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:     #0F172A;
      --blue:     #1D4ED8;
      --blue-mid: #2563EB;
      --blue-bg:  #EFF6FF;
      --blue-border: #BFDBFE;
      --text:     #0F172A;
      --text-2:   #475569;
      --text-3:   #94A3B8;
      --bg:       #F8FAFC;
      --white:    #FFFFFF;
      --border:   #E2E8F0;
      --green:    #16A34A;
      --green-bg: #F0FDF4;
      --orange:   #EA580C;
      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 16px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md: 0 4px 16px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.04);
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── NAV ─────────────────────────────────── */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex; justify-content: center;
      padding: 14px 24px;
      pointer-events: none;
    }
    .nav-in {
      pointer-events: all;
      display: flex; align-items: center; gap: 4px;
      background: rgba(255,255,255,0.88);
      backdrop-filter: saturate(180%) blur(16px);
      -webkit-backdrop-filter: saturate(180%) blur(16px);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 6px 6px 6px 14px;
      box-shadow: var(--shadow-sm);
    }
    .nav-logo {
      display: flex; align-items: center; gap: 7px;
      text-decoration: none; border-radius: 100px;
      padding: 2px 10px 2px 0; margin-right: 4px;
    }
    .nav-logo img { width: 28px; height: 28px; border-radius: 7px; object-fit: cover; }
    .nav-logo span { font-weight: 700; font-size: 15px; color: var(--text); }
    .nav-links { display: flex; align-items: center; gap: 0; }
    .nav-links a {
      text-decoration: none; color: var(--text-2);
      font-size: 14px; font-weight: 500;
      padding: 10px 14px; border-radius: 100px;
      transition: color .15s, background .15s;
      white-space: nowrap;
    }
    .nav-links a:hover { color: var(--text); background: rgba(0,0,0,.05); }
    .nav-links a[aria-current] { color: var(--blue); font-weight: 600; }
    .nav-cta {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--navy); color: #fff;
      font-size: 14px; font-weight: 600;
      padding: 9px 18px; border-radius: 100px;
      text-decoration: none; transition: opacity .15s;
    }
    .nav-cta:hover { opacity: .85; }

    /* ── LAYOUT ──────────────────────────────── */
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 96px 24px 80px;
    }

    /* ── BREADCRUMB ──────────────────────────── */
    .breadcrumb {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--text-3);
      margin-bottom: 24px;
    }
    .breadcrumb a { color: var(--text-3); text-decoration: none; }
    .breadcrumb a:hover { color: var(--blue); }
    .breadcrumb span { color: var(--text-3); }

    /* ── CARD HEADER ─────────────────────────── */
    .card-header {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 32px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }
    .card-meta-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px; flex-wrap: wrap;
    }
    .bank-label {
      font-size: 11px; font-weight: 800;
      color: var(--blue); letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .status-badge {
      font-size: 11px; font-weight: 700;
      padding: 2px 8px; border-radius: 100px;
    }
    .status-badge.active {
      background: var(--green-bg); color: var(--green);
    }
    .card-type-tag {
      font-size: 11px; font-weight: 600;
      background: var(--blue-bg); color: var(--blue);
      padding: 2px 8px; border-radius: 100px;
    }
    .card-title {
      font-size: clamp(22px, 3vw, 32px);
      font-weight: 900; letter-spacing: -.5px;
      color: var(--text); margin-bottom: 12px;
      line-height: 1.2;
    }
    .card-summary {
      font-size: 15px; color: var(--text-2);
      line-height: 1.7; margin-bottom: 24px;
    }
    .apply-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--blue); color: #fff;
      font-size: 15px; font-weight: 700;
      padding: 12px 28px; border-radius: 100px;
      text-decoration: none;
      transition: background .15s, transform .15s;
    }
    .apply-btn:hover { background: var(--blue-mid); transform: translateY(-1px); }

    /* ── STATS GRID ──────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }
    .stat-label {
      font-size: 11px; font-weight: 700;
      color: var(--text-3); letter-spacing: .8px;
      text-transform: uppercase; margin-bottom: 6px;
    }
    .stat-value {
      font-size: 15px; font-weight: 700;
      color: var(--text); line-height: 1.4;
    }
    .stat-value.highlight { color: var(--blue); }

    /* ── WELCOME OFFER ───────────────────────── */
    .welcome-box {
      background: linear-gradient(135deg, var(--navy) 0%, #1E3A8A 100%);
      border-radius: var(--r-lg);
      padding: 24px 28px;
      margin-bottom: 16px;
      color: #fff;
    }
    .welcome-lbl {
      font-size: 10px; font-weight: 800;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: rgba(255,255,255,.55); margin-bottom: 6px;
    }
    .welcome-title {
      font-size: 18px; font-weight: 800;
      margin-bottom: 8px; line-height: 1.3;
    }
    .welcome-detail {
      font-size: 14px; color: rgba(255,255,255,.72);
      line-height: 1.7;
    }

    /* ── KEY BENEFITS ────────────────────────── */
    .section-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 24px 28px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }
    .section-title {
      font-size: 13px; font-weight: 800;
      color: var(--text-3); letter-spacing: 1px;
      text-transform: uppercase; margin-bottom: 16px;
    }
    .benefits-list {
      display: flex; flex-direction: column; gap: 10px;
      list-style: none;
    }
    .benefits-list li {
      display: flex; align-items: flex-start; gap: 10px;
      font-size: 14px; color: var(--text-2); line-height: 1.5;
    }
    .benefit-dot {
      width: 20px; height: 20px;
      background: var(--blue-bg);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 1px;
    }
    .benefit-dot svg { color: var(--blue); }

    /* ── RICH TEXT CONTENT ───────────────────── */
    .content-body { font-size: 15px; color: var(--text-2); line-height: 1.8; }
    .content-body p { margin-bottom: 14px; }
    .content-body p:last-child { margin-bottom: 0; }
    .content-body strong { color: var(--text); font-weight: 700; }

    /* ── TAGS ────────────────────────────────── */
    .tags-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag {
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text-2); font-size: 12px; font-weight: 600;
      padding: 4px 12px; border-radius: 100px;
    }

    /* ── LOADING / ERROR ─────────────────────── */
    .state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 60vh; gap: 12px; color: var(--text-3);
      text-align: center;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── RESPONSIVE ──────────────────────────── */
    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: 1fr; }
      .card-header { padding: 24px 20px; }
      .section-card, .welcome-box { padding: 20px; }
      main { padding: 80px 16px 60px; }
    }
  </style>
</head>
<body>

  <nav aria-label="主導航">
    <div class="nav-in">
      <a href="index.html" class="nav-logo" aria-label="HK Miles 首頁">
        <img src="assets/logo.png" alt="HK Miles">
        <span>HK Miles</span>
      </a>
      <div class="nav-links" role="list">
        <a href="promotions.html" role="listitem">優惠情報</a>
        <a href="promotions.html" role="listitem" aria-current="page">信用卡</a>
        <a href="https://apple.co/4dnOqe2" role="listitem" class="nav-cta" target="_blank" rel="noopener noreferrer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
          </svg>
          免費下載
        </a>
      </div>
    </div>
  </nav>

  <main id="main">
    <div id="load-state" class="state">
      <div class="spinner"></div>
      <p>載入信用卡資料…</p>
    </div>
    <div id="card-content" style="display:none"></div>
  </main>

  <script>
    const PROJECT_ID = 'j3rszqec';
    const DATASET    = 'promotions';
    const API_VER    = '2024-01-01';

    // Get slug from URL: card.html?slug=red-card
    const params = new URLSearchParams(window.location.search);
    const slug   = params.get('slug') || 'red-card';

    const QUERY = encodeURIComponent(
      `*[_type == "creditCard" && slug.current == "${slug}"][0]`
    );

    const URL = `https://${PROJECT_ID}.api.sanity.io/v${API_VER}/data/query/${DATASET}?query=${QUERY}`;

    function esc(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderBlocks(blocks) {
      if (!blocks) return '';
      return blocks.map(b => {
        if (b._type !== 'block') return '';
        const text = (b.children || []).map(s => {
          let t = esc(s.text || '');
          if ((s.marks || []).includes('strong')) t = `<strong>${t}</strong>`;
          if ((s.marks || []).includes('em')) t = `<em>${t}</em>`;
          return t;
        }).join('');
        return `<p>${text}</p>`;
      }).join('');
    }

    function typeLabel(t) {
      const map = { cashback:'現金回贈', miles:'里數', dining:'餐飲', lifestyle:'生活', travel:'旅遊', online:'網購' };
      return map[t] || t;
    }

    function render(card) {
      const types = (card.cardType || []).map(t =>
        `<span class="card-type-tag">${esc(typeLabel(t))}</span>`
      ).join('');

      const benefits = (card.keyBenefits || []).map(b => `
        <li>
          <span class="benefit-dot">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
          ${esc(b)}
        </li>`).join('');

      const tags = (card.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');

      document.title = `${card.seoTitle || card.title} | HK Miles`;

      return `
        <nav class="breadcrumb" aria-label="breadcrumb">
          <a href="promotions.html">優惠情報</a>
          <span>›</span>
          <a href="promotions.html">信用卡</a>
          <span>›</span>
          <span>${esc(card.bank || '')}</span>
          <span>›</span>
          <span>${esc(card.title || '')}</span>
        </nav>

        <!-- Header -->
        <div class="card-header">
          <div class="card-meta-row">
            <span class="bank-label">${esc(card.bank || '')}</span>
            ${card.status === 'Active' ? '<span class="status-badge active">有效</span>' : ''}
            ${types}
          </div>
          <h1 class="card-title">${esc(card.title || '')}</h1>
          <p class="card-summary">${esc(card.summary || '')}</p>
          ${card.applyUrl ? `<a href="${esc(card.applyUrl)}" class="apply-btn" target="_blank" rel="noopener noreferrer">
            立即申請
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </a>` : ''}
        </div>

        <!-- Stats -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">回贈率</div>
            <div class="stat-value highlight">${esc(card.rewardRateSummary || '—')}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">年費</div>
            <div class="stat-value">${esc(card.annualFee || '—')}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">最低年薪要求</div>
            <div class="stat-value">${esc(card.minimumIncome || '—')}</div>
          </div>
        </div>

        ${card.welcomeOfferTitle ? `
        <!-- Welcome Offer -->
        <div class="welcome-box">
          <div class="welcome-lbl">迎新優惠</div>
          <div class="welcome-title">${esc(card.welcomeOfferTitle)}</div>
          ${card.welcomeOfferDetails ? `<div class="welcome-detail">${esc(card.welcomeOfferDetails)}</div>` : ''}
        </div>` : ''}

        ${benefits ? `
        <!-- Key Benefits -->
        <div class="section-card">
          <div class="section-title">主要優惠</div>
          <ul class="benefits-list">${benefits}</ul>
        </div>` : ''}

        ${card.content ? `
        <!-- Full Content -->
        <div class="section-card">
          <div class="section-title">詳細資料</div>
          <div class="content-body">${renderBlocks(card.content)}</div>
        </div>` : ''}

        ${tags ? `
        <!-- Tags -->
        <div class="section-card">
          <div class="section-title">標籤</div>
          <div class="tags-wrap">${tags}</div>
        </div>` : ''}
      `;
    }

    fetch(URL)
      .then(r => r.json())
      .then(({ result }) => {
        document.getElementById('load-state').style.display = 'none';
        const el = document.getElementById('card-content');
        if (!result) {
          el.innerHTML = '<div class="state"><p>找不到此信用卡。</p></div>';
        } else {
          el.innerHTML = render(result);
        }
        el.style.display = 'block';
      })
      .catch(() => {
        document.getElementById('load-state').innerHTML =
          '<div class="state"><p>載入失敗，請稍後重試。</p></div>';
      });
  </script>
</body>
</html>
