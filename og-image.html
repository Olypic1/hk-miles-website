<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  }

  .card {
    width: 1200px;
    height: 630px;
    background: #0F172A;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Sliding card banner background */
  .bg-banner {
    position: absolute;
    inset: 60px 0;
    background-image: url('assets/card-banner.png');
    background-repeat: no-repeat;
    background-size: auto 100%;
    background-position: 30% 50%;
    opacity: 0.12;
  }

  /* Edge fades */
  .bg-fade {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to right, #0F172A 0%, transparent 30%, transparent 70%, #0F172A 100%),
      linear-gradient(to bottom, #0F172A 0%, transparent 25%, transparent 75%, #0F172A 100%);
    z-index: 1;
  }

  /* Blue glow accent */
  .glow {
    position: absolute;
    width: 600px;
    height: 400px;
    background: radial-gradient(ellipse, rgba(29, 78, 216, 0.25) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
  }

  /* Subtle grid */
  .grid-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: 1;
  }

  .content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 28px;
  }

  .logo-img {
    width: 72px;
    height: 72px;
    border-radius: 18px;
    box-shadow: 0 8px 32px rgba(29, 78, 216, 0.4);
  }

  .app-name {
    font-size: 56px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -1.5px;
    line-height: 1;
  }

  .tagline-zh {
    font-size: 24px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.65);
    letter-spacing: 1px;
    margin-bottom: 36px;
  }

  .pills {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .pill {
    background: rgba(29, 78, 216, 0.2);
    border: 1px solid rgba(29, 78, 216, 0.5);
    color: #93C5FD;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 16px;
    border-radius: 100px;
    letter-spacing: 0.3px;
  }

  .pill.white {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.55);
  }

  .domain {
    position: absolute;
    bottom: 36px;
    right: 48px;
    font-size: 15px;
    color: rgba(255,255,255,0.25);
    font-weight: 500;
    letter-spacing: 0.5px;
    z-index: 10;
  }

  /* Decorative blue line top */
  .top-line {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(to right, transparent, #1D4ED8, #3B82F6, #1D4ED8, transparent);
    z-index: 10;
  }
</style>
</head>
<body>
<div class="card">
  <div class="top-line"></div>
  <div class="bg-banner"></div>
  <div class="bg-fade"></div>
  <div class="grid-bg"></div>
  <div class="glow"></div>

  <div class="content">
    <div class="logo-row">
      <img src="assets/logo.png" class="logo-img" alt="HK Miles">
      <div class="app-name">HK Miles</div>
    </div>
    <div class="tagline-zh">香港信用卡里數及回贈比較</div>
    <div class="pills">
      <div class="pill">免費下載</div>
      <div class="pill">智能比較</div>
      <div class="pill">無廣告</div>
      <div class="pill white">iOS App</div>
    </div>
  </div>

  <div class="domain">hkmiles.app</div>
</div>
</body>
</html>
